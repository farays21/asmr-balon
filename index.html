<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0f1020" />
<title>ASMR Balon Pemecah</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --glass: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.16);
    --text: #f2f4ff;
    --muted: rgba(242, 244, 255, 0.62);
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0c18;
    color: var(--text);
    font-family: "Segoe UI", "Trebuchet MS", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== Latar ambient ===== */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(1200px 800px at 12% 18%, #2b2a6b 0%, transparent 60%),
      radial-gradient(900px 700px at 88% 78%, #6d2b63 0%, transparent 62%),
      radial-gradient(700px 700px at 70% 12%, #124a6b 0%, transparent 58%),
      linear-gradient(160deg, #0b0c18 0%, #141530 55%, #0b0c18 100%);
  }
  .blob {
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    pointer-events: none;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .blob.b1 { width: 340px; height: 340px; left: -80px; top: 8%;  background: #6f6bff; }
  .blob.b2 { width: 300px; height: 300px; right: -70px; top: 52%; background: #ff7ac6; animation-duration: 32s; }
  .blob.b3 { width: 260px; height: 260px; left: 38%; bottom: -90px; background: #4be3c0; animation-duration: 22s; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(40px, -50px, 0) scale(1.18); }
  }

  /* ===== Panggung ===== */
  #stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    touch-action: none;
    cursor: crosshair;
  }

  /* ===== HUD ===== */
  .hud {
    position: fixed;
    z-index: 5;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: min(94vw, 720px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 18px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, #ff9ad5, #9ad5ff, #a6ffd8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
  }
  .stats { display: flex; gap: 8px; }
  .stat {
    min-width: 74px;
    text-align: center;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .stat span {
    display: block;
    font-size: 19px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .stat small {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  #comboStat span { color: #ffd166; }

  .tools {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 16px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
    width: min(94vw, 560px);
  }
  button {
    font: inherit;
    color: var(--text);
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 12px;
    padding: 8px 13px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease, opacity 0.2s ease;
    white-space: nowrap;
  }
  button:hover { background: rgba(255, 255, 255, 0.18); }
  button:active { transform: scale(0.94); }
  button.off { opacity: 0.45; }
  .slider {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    flex: 1;
  }
  input[type="range"] {
    flex: 1;
    accent-color: #ff9ad5;
    height: 4px;
  }

  /* ===== Balon ===== */
  .balloon {
    position: absolute;
    left: 0;
    top: 0;
    will-change: transform;
    pointer-events: none;
    border-radius: 50% 50% 50% 50% / 46% 46% 54% 54%;
    box-shadow:
      0 14px 28px rgba(0, 0, 0, 0.38),
      inset 0 -12px 26px rgba(0, 0, 0, 0.2),
      inset 0 8px 18px rgba(255, 255, 255, 0.12);
  }
  /* kilau */
  .balloon::before {
    content: "";
    position: absolute;
    left: 20%;
    top: 13%;
    width: 26%;
    height: 18%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 55%, transparent 75%);
    transform: rotate(-18deg);
    filter: blur(0.4px);
  }
  /* simpul /Pentol di bawah */
  .balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    width: 0;
    height: 0;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 9px solid var(--base, #ff8fb1);
  }
  .string {
    position: absolute;
    left: 50%;
    top: 100%;
    width: 2px;
    height: 46px;
    margin-left: -1px;
    transform-origin: top center;
    background: linear-gradient(to bottom, rgba(255,255,255,.62), rgba(255,255,255,.05));
    border-radius: 2px;
  }

  /* ===== Efek pecah ===== */
  .particle {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
  }
  .shock {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.85);
    pointer-events: none;
    z-index: 3;
  }
  .pop-text {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 4;
    pointer-events: none;
    font-weight: 800;
    font-size: 18px;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
    white-space: nowrap;
  }

  /* ===== Petunjuk ===== */
  .hint {
    position: fixed;
    z-index: 6;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    padding: 22px 28px;
    border-radius: 20px;
    background: rgba(10, 10, 25, 0.6);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    pointer-events: none;
    transition: opacity 0.7s ease;
  }
  .hint h2 { margin: 0 0 6px; font-size: 19px; }
  .hint p { margin: 0; font-size: 13px; color: var(--muted); }
  .hint.gone { opacity: 0; }

  .flash {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), rgba(255,255,255,.35), transparent 38%);
    opacity: 0;
    pointer-events: none;
  }

  @media (max-width: 560px) {
    .brand h1 { font-size: 14px; }
    .stat { min-width: 60px; padding: 5px 8px; }
    .stat span { font-size: 16px; }
    .tools { flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>
<div class="flash" id="flash"></div>

<div id="stage"></div>

<header class="hud">
  <div class="brand">
    <span style="font-size:22px">🎈</span>
    <h1>ASMR Balon Pemecah</h1>
  </div>
  <div class="stats">
    <div class="stat" id="scoreStat">
      <span id="score">0</span>
      <small>Balon Pecah</small>
    </div>
    <div class="stat" id="comboStat">
      <span id="combo">—</span>
      <small>Combo</small>
    </div>
    <div class="stat">
      <span id="remaining">0</span>
      <small>Aktif</small>
    </div>
  </div>
</header>

<div class="tools">
  <button id="soundBtn" title="Suara">🔊</button>
  <button id="ambientBtn" title="Ambient">🌙</button>
  <label class="slider">
    Kecepatan
    <input type="range" id="speed" min="30" max="220" value="100" />
  </label>
  <button id="resetBtn" title="Mulai ulang">⟳ Reset</button>
</div>

<div class="hint" id="hint">
  <h2>🎈 Ketuk / Klik balon untuk memecahkannya</h2>
  <p>Suara dibuat langsung oleh browser — turn up the volume untuk sensasi ASMR-nya.</p>
</div>

<script>
(() => {
  "use strict";

  const stage = document.getElementById("stage");
  const scoreEl = document.getElementById("score");
  const comboEl = document.getElementById("combo");
  const remainEl = document.getElementById("remaining");
  const soundBtn = document.getElementById("soundBtn");
  const ambientBtn = document.getElementById("ambientBtn");
  const speedInput = document.getElementById("speed");
  const resetBtn = document.getElementById("resetBtn");
  const hint = document.getElementById("hint");
  const flash = document.getElementById("flash");

  const MAX_BALLOONS = 18;
  const PALETTE = [
    { base: "#ff4d8d", light: "#ff9ec4" },
    { base: "#ff7a45", light: "#ffc09f" },
    { base: "#ffc93c", light: "#ffe9a8" },
    { base: "#5ad07a", light: "#b6f2c8" },
    { base: "#3ec9ff", light: "#a8e8ff" },
    { base: "#6a7bff", light: "#c0c8ff" },
    { base: "#c86bff", light: "#eac6ff" },
    { base: "#ff5ec4", light: "#ffc2ec" }
  ];

  let balloons = [];
  let score = 0;
  let combo = 0;
  let comboTimer = null;
  let speedMul = 1;
  let last = performance.now();

  /* =========================================================
     AUDIO — suara dibuat langsung dengan Web Audio API
     ========================================================= */
  let audioCtx = null;
  let master = null;
  let ambientGain = null;
  let noiseBuffer = null;
  let soundOn = true;
  let ambientOn = true;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    master = audioCtx.createGain();
    master.gain.value = 0.9;
    master.connect(audioCtx.destination);

    // buffer noise putih untuk efek "pop"
    const len = Math.floor(audioCtx.sampleRate * 1.0);
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    startAmbient();
  }

  function resumeAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  // lapisan ambient lembut: derau brown + napasan LFO
  function startAmbient() {
    if (!audioCtx || ambientGain) return;
    ambientGain = audioCtx.createGain();
    ambientGain.gain.value = 0;
    ambientGain.connect(master);

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;

    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 420;
    lp.Q.value = 0.6;

    const hp = audioCtx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 90;

    // napasan: gain naik-turun pelan
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.08;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.35;
    lfo.connect(lfoGain).connect(ambientGain.gain);

    src.connect(hp).connect(lp).connect(ambientGain);
    src.start();
    lfo.start();
  }

  function setAmbient(on) {
    ambientOn = on;
    if (!ambientGain || !audioCtx) return;
    const t = audioCtx.currentTime;
    ambientGain.gain.cancelScheduledValues(t);
    ambientGain.gain.setTargetAtTime(on ? 0.05 : 0, t, 0.6);
  }

  // suara pecah: letupan noise singkat + "tok" bass
  function playPop(size) {
    if (!soundOn || !audioCtx) return;
    const t = audioCtx.currentTime;
    const s = size / 100; // 0.4 - 1

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    src.playbackRate.value = 0.9 + s * 0.5;

    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(1400 + s * 900, t);
    bp.frequency.exponentialRampToValueAtTime(500, t + 0.09);
    bp.Q.value = 0.9;

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.75 * (0.6 + s * 0.6), t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);

    src.connect(bp).connect(g).connect(master);
    src.start(t);
    src.stop(t + 0.16);

    const osc = audioCtx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(300 + s * 160, t);
    osc.frequency.exponentialRampToValueAtTime(70, t + 0.09);
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0.45, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    osc.connect(og).connect(master);
    osc.start(t);
    osc.stop(t + 0.16);
  }

  // chime halus untuk combo
  function playChime(level) {
    if (!soundOn || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = 660 * Math.pow(2, Math.min(level, 6) / 12);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    osc.connect(g).connect(master);
    osc.start(t);
    osc.stop(t + 0.55);
  }

  /* =========================================================
     BALON
     ========================================================= */
  function stageSize() {
    return { w: stage.clientWidth, h: stage.clientHeight };
  }

  function spawnBalloon(initial = false) {
    const { w: SW, h: SH } = stageSize();
    const size = 46 + Math.random() * 48;      // lebar 46 - 94
    const h = size * 1.22;
    const c = PALETTE[Math.floor(Math.random() * PALETTE.length)];

    const el = document.createElement("div");
    el.className = "balloon";
    el.style.width = size + "px";
    el.style.height = h + "px";
    el.style.setProperty("--base", c.base);
    el.style.background =
      `radial-gradient(circle at 32% 26%, rgba(255,255,255,.75) 0%, rgba(255,255,255,.18) 14%, transparent 40%),` +
      `linear-gradient(160deg, ${c.light} 0%, ${c.base} 62%, ${c.base} 100%)`;

    const string = document.createElement("span");
    string.className = "string";
    el.appendChild(string);
    stage.appendChild(el);

    const b = {
      el, string,
      w: size, h,
      x: initial ? Math.random() * Math.max(1, SW - size) : -size - 40,
      y: Math.random() * Math.max(1, SH - h),
      vx: (0.25 + Math.random() * 0.5) * (Math.random() < 0.5 ? -1 : 1),
      vy: (0.12 + Math.random() * 0.3) * (Math.random() < 0.5 ? -1 : 1),
      swayAmp: 8 + Math.random() * 18,
      swaySpeed: 0.5 + Math.random() * 0.9,
      phase: Math.random() * Math.PI * 2,
      swayOffset: 0,
      color: c.base,
      light: c.light,
      alive: true
    };
    balloons.push(b);
    return b;
  }

  function removeBalloon(b) {
    b.alive = false;
    const i = balloons.indexOf(b);
    if (i >= 0) balloons.splice(i, 1);
    b.el.remove();
  }

  function reset() {
    balloons.forEach(b => b.el.remove());
    balloons = [];
    score = 0;
    combo = 0;
    comboEl.textContent = "—";
    scoreEl.textContent = "0";
    for (let i = 0; i < MAX_BALLOONS; i++) spawnBalloon(true);
    updateRemaining();
  }

  function updateRemaining() {
    remainEl.textContent = balloons.length;
  }

  /* =========================================================
     LOOP GERAK
     ========================================================= */
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;
    const { w: SW, h: SH } = stageSize();

    for (const b of balloons) {
      b.phase += dt * b.swaySpeed;
      b.swayOffset = Math.sin(b.phase) * b.swayAmp;

      b.x += b.vx * dt * 60 * speedMul;
      b.y += b.vy * dt * 60 * speedMul;

      // pantul kiri-kanan
      if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx); }
      if (b.x > SW - b.w) { b.x = SW - b.w; b.vx = -Math.abs(b.vx); }
      // pantul atas-bawah
      if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy); }
      if (b.y > SH - b.h) { b.y = SH - b.h; b.vy = -Math.abs(b.vy); }

      b.el.style.transform = `translate3d(${b.x + b.swayOffset}px, ${b.y}px, 0)`;
      // tali ikut bergoyang mengikuti arah gerak
      b.string.style.transform = `rotate(${b.vx * 14}deg)`;
    }

    requestAnimationFrame(frame);
  }

  /* =========================================================
     LEDAKAN & EFEK
     ========================================================= */
  function burst(x, y, color, light) {
    // cincin kejut
    const ring = document.createElement("div");
    ring.className = "shock";
    ring.style.left = x + "px";
    ring.style.top = y + "px";
    stage.appendChild(ring);
    ring.animate(
      [
        { width: "10px", height: "10px", marginLeft: "-5px", marginTop: "-5px", opacity: 0.9, borderColor: "#fff" },
        { width: "150px", height: "150px", marginLeft: "-75px", marginTop: "-75px", opacity: 0, borderColor: color }
      ],
      { duration: 520, easing: "cubic-bezier(.2,.8,.3,1)" }
    ).onfinish = () => ring.remove();

    // pecahan lateks
    const count = 16;
    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      const sz = 3 + Math.random() * 7;
      p.className = "particle";
      p.style.width = sz + "px";
      p.style.height = sz + "px";
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = Math.random() > 0.45 ? color : light;
      stage.appendChild(p);

      const ang = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 110;
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist - 40;

      const anim = p.animate(
        [
          { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
          { transform: `translate(calc(-50% + ${dx * 0.7}px), calc(-50% + ${dy * 0.7}px)) scale(1.15)`, opacity: 1, offset: 0.35 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 90}px)) scale(0.3)`, opacity: 0 }
        ],
        { duration: 700 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.4,1)" }
      );
      anim.onfinish = () => p.remove();
    }
  }

  function popText(x, y, text, color) {
    const el = document.createElement("div");
    el.className = "pop-text";
    el.textContent = text;
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.color = color;
    stage.appendChild(el);
    el.animate(
      [
        { transform: "translate(-50%,-50%) scale(.7)", opacity: 0 },
        { transform: "translate(-50%,-140%) scale(1.1)", opacity: 1, offset: 0.3 },
        { transform: "translate(-50%,-260%) scale(1)", opacity: 0 }
      ],
      { duration: 900, easing: "ease-out" }
    ).onfinish = () => el.remove();
  }

  function flashScreen(x, y) {
    flash.style.setProperty("--fx", x + "px");
    flash.style.setProperty("--fy", y + "px");
    flash.animate([{ opacity: 0.42 }, { opacity: 0 }], { duration: 420, easing: "ease-out" });
  }

  /* =========================================================
     HIT TEST (bentuk elips, bukan kotak)
     ========================================================= */
  function hitTest(px, py) {
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      const cx = b.x + b.w / 2 + b.swayOffset;
      const cy = b.y + b.h / 2;
      const dx = (px - cx) / (b.w / 2);
      const dy = (py - cy) / (b.h / 2);
      if (dx * dx + dy * dy <= 1) return b;
    }
    return null;
  }

  function pop(b, px, py) {
    const cx = b.x + b.w / 2 + b.swayOffset;
    const cy = b.y + b.h / 2;

    score++;
    scoreEl.textContent = score;

    // combo: pecah beruntun dalam 1.2 detik
    combo++;
    comboEl.textContent = combo >= 2 ? "x" + combo : "—";
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { combo = 0; comboEl.textContent = "—"; }, 1200);
    if (combo > 1) playChime(combo);

    removeBalloon(b);
    burst(cx, cy, b.color, b.light);
    popText(cx, cy, combo >= 2 ? "Combo x" + combo : "+1", b.light);
    flashScreen(cx, cy);
    playPop(b.w);
    if (navigator.vibrate) navigator.vibrate(Math.min(40, 12 + b.w / 3));

    updateRemaining();

    // balon pengganti supaya scene tetap hidup
    setTimeout(() => {
      if (balloons.length < MAX_BALLOONS) {
        spawnBalloon(false);
        updateRemaining();
      }
    }, 220 + Math.random() * 500);
  }

  /* =========================================================
     EVENT
     ========================================================= */
  function onPointerDown(e) {
    resumeAudio();
    const px = e.clientX;
    const py = e.clientY;
    const b = hitTest(px, py);
    if (b) pop(b, px, py);
    hideHint();
  }

  function hideHint() {
    if (hint && !hint.classList.contains("gone")) hint.classList.add("gone");
  }

  stage.addEventListener("pointerdown", onPointerDown);
  stage.addEventListener("contextmenu", e => e.preventDefault());

  soundBtn.addEventListener("click", () => {
    resumeAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.classList.toggle("off", !soundOn);
    if (master && audioCtx) {
      master.gain.setTargetAtTime(soundOn ? 0.9 : 0, audioCtx.currentTime, 0.1);
    }
  });

  ambientBtn.addEventListener("click", () => {
    resumeAudio();
    setAmbient(!ambientOn);
    ambientBtn.textContent = ambientOn ? "🌙" : "☀️";
    ambientBtn.classList.toggle("off", !ambientOn);
  });

  speedInput.addEventListener("input", () => {
    speedMul = Number(speedInput.value) / 100;
  });

  resetBtn.addEventListener("click", () => {
    resumeAudio();
    reset();
    hideHint();
  });

  window.addEventListener("resize", () => {
    const { w: SW, h: SH } = stageSize();
    for (const b of balloons) {
      b.x = Math.max(0, Math.min(b.x, SW - b.w));
      b.y = Math.max(0, Math.min(b.y, SH - b.h));
    }
  });

  // mulai
  reset();
  requestAnimationFrame(frame);
  setTimeout(hideHint, 9000);
})();
</script>
</body>
</html>
